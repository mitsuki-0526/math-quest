# GitHub Pages への自動デプロイ(要件 §7.1 ホスティング)。
# リポジトリの Settings → Pages → Source を "GitHub Actions" にする。
# Settings → Secrets and variables → Actions → Variables に VITE_GAS_URL / VITE_API_TOKEN を登録する。
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GAS_URL: ${{ vars.VITE_GAS_URL }}
          VITE_API_TOKEN: ${{ vars.VITE_API_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
